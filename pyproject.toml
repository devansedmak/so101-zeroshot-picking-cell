[project]
name = "zeroshot-picking-cell"
version = "0.1.0"
description = "Order-driven zero-shot picking cell on SO-101 with Cyberwave (Cyberwave Builders Program Cohort 2)"
authors = [{ name = "Devan Sedmak" }]
requires-python = ">=3.10"
dependencies = [
    "cyberwave[camera]",
    "numpy",
    "opencv-python",
    "pillow",          # the SDK's mlmodels.run image path imports PIL lazily — missing it
                       # fails ONLY on the real VLM call, i.e. exactly during a live demo
    "python-dotenv",
]

[project.optional-dependencies]
# NOTE: the local BERT-NER + GroundingDINO stack (transformers/torch) was dropped as the
# primary perception path in favour of the Cyberwave-hosted VLM (D10/D13), and the VLA
# training fallback is dead (D18) — so neither is a dependency of anything we ship.
# Order intake is deliberately stdlib http.server, not FastAPI (D16).
dev = ["pytest", "ruff", "black"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
